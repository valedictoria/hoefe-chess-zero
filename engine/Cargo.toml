[workspace]
members = ["chesszero-core", "chesszero-nn", "chesszero-search", "chesszero-teacher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
shakmaty = "0.30"
serde_json = "1"
candle-core = "0.11"
candle-nn = "0.11"
safetensors = "0.8"
chesszero-core = { path = "chesszero-core" }
chesszero-nn = { path = "chesszero-nn" }
chesszero-search = { path = "chesszero-search" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
